
name:  backend_recheck-deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64, myrunner]

    env:
      DOCKER_IMAGE: snk6182/backend-collection:v1

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 3. Maven build
      - name: Maven Clean Package
        run: mvn clean package

      # 4. Verify Docker credentials
      - name: Verify Docker Secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -e

          if [ -z "$DOCKER_USERNAME" ]; then
            echo "Docker username is missing"
            exit 1
          fi

          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "Docker password is missing"
            exit 1
          fi

          echo "Docker credentials verified"

      # 5. Docker Hub login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build Docker image
      - name: Docker Build
        run: |
          docker build -t $DOCKER_IMAGE .

      # 7. Push Docker image
      - name: Docker Push
        run: |
          docker push $DOCKER_IMAGE

      # 8. Configure Kubernetes
      - name: Configure Kubernetes kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          set -e

          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "Kubernetes kubeconfig secret is missing"
            exit 1
          fi

          mkdir -p "$HOME/.kube"

          printf '%s\n' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          echo "Checking Kubernetes connection..."

          kubectl config current-context
          kubectl get nodes

      # 9. Validate Kubernetes YAML
      - name: Validate Kubernetes YAML
        run: |
          set -e

          kubectl apply --dry-run=client -f deployment.yml
          kubectl apply --dry-run=client -f service.yml

      # 10. Deploy backend application
      - name: Deploy Kubernetes Application
        run: |
          set -e

          kubectl apply -f deployment.yml
          kubectl apply -f service.yml

          kubectl set image deployment/backend-deployment \
            backend-app=$DOCKER_IMAGE

          kubectl rollout status deployment/backend-deployment \
            --timeout=180s

      # 11. Verify deployment
      - name: Verify Deployment
        run: |
          echo "Deployment status:"
          kubectl get deployments

          echo "Pods status:"
          kubectl get pods -o wide

          echo "Services status:"
          kubectl get services

          echo "Backend deployment completed successfully"

      # 12. Docker logout
      - name: Docker Logout
        if: always()
        run: docker logout
